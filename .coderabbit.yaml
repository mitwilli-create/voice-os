language: en
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  related_issues: false
  related_prs: false
  auto_review:
    enabled: false
    drafts: false
    auto_incremental_review: false
  path_filters:
  - '!**/package-lock.json'
  - '!**/pnpm-lock.yaml'
  - '!**/yarn.lock'
  - '!**/flake.lock'
  - '!**/dist/**'
  - '!**/build/**'
  - '!**/*-snapshots/**'
  path_instructions:
  - path: '**'
    instructions: 'Raise findings only for defects in code behavior. ALWAYS raise,
      at any severity: correctness bugs (wrong output, unhandled edge cases, broken
      control flow), security vulnerabilities (command injection, path traversal,
      SSRF, secret exposure), and data-integrity risks (silent data loss, corruption,
      schema or data-contract violations). Do NOT raise process or workflow reminders
      rather than code defects — reminders to run slash-commands or helper scripts,
      lane/file-ownership etiquette, commit-message or PR-description conventions,
      or restating rules from CLAUDE.md / AGENTS.md. If a finding would begin with
      "remember to", "consider running", or "per the project''s workflow", omit it.'
  - path: '**/*.mjs'
    instructions: Check for command injection, path traversal, and SSRF; ensure scripts
      handle missing files/dirs gracefully.
  - path: CLAUDE.md
    instructions: This file controls agent behavior — review changes carefully for
      conflicts with existing instructions.
  finishing_touches:
    autofix:
      enabled: false
knowledge_base:
  code_guidelines:
    enabled: false
  learnings:
    scope: local
chat:
  auto_reply: false
